<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <h1>My Tasks</h1>
        <div class="add"><input id="task-input" type="text" placeholder="What needs doing?" maxlength="120"><button
                id="add-btn">Add Task</button></div>
        <section>
            <h2>Pending Tasks <span id="pending-count" class="count"></span></h2>
            <ul id="pending-list"></ul>
        </section>
        <section>
            <h2>Completed Tasks <span id="completed-count" class="count"></span></h2>
            <ul id="completed-list"></ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
